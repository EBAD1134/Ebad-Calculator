<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebad Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #e9eef5;
    transition: 0.3s;
}

.calculator {
    width: 390px;
    max-width: 95vw;
    padding: 18px;
    border-radius: 22px;
    background: #ffffff;
    box-shadow: 0 12px 35px rgba(0,0,0,0.18);
}

.title {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 12px;
}

.display-box {
    width: 100%;
    background: #f1f4f8;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
    overflow: hidden;
}

.expression {
    min-height: 24px;
    text-align: right;
    color: #777;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
}

.display {
    width: 100%;
    min-height: 55px;
    border: none;
    outline: none;
    background: transparent;
    text-align: right;
    font-size: 34px;
    font-weight: bold;
    color: #111;
}

/* General button style */
button {
    border: none;
    border-radius: 12px;
    min-height: 52px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.12s;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
}

button:hover {
    filter: brightness(0.94);
}

button:active {
    transform: scale(0.95);
}

/* Top row */
.top-controls {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}

.utility {
    background: #dce3eb;
    color: #222;
}

/* Scientific row */
.scientific-row {
    display: none;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    margin-bottom: 10px;
}

.scientific-row.show {
    display: grid;
}

.scientific {
    background: #d9d2f3;
    color: #30235c;
    min-height: 45px;
    font-size: 15px;
}

/* Main keypad */
.main-keypad {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 9px;
}

/* Number side */
.number-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.number {
    background: #eef1f5;
    color: #111;
}

.number.zero {
    grid-column: span 1;
}

/* Extra buttons under numbers */
.extra-row {
    display: contents;
}

.extra {
    background: #dfe5ec;
    font-size: 15px;
}

/* Operator side */
.operator-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.operator {
    background: #cfdcf1;
    color: #15345c;
    font-size: 21px;
}

.equals {
    background: #4d78b8;
    color: white;
    font-size: 25px;
}

/* Bottom controls */
.bottom-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.bottom-button {
    background: #dfe5ec;
    min-height: 45px;
    font-size: 15px;
}

/* History */
.history-panel {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    background: #f1f4f8;
    max-height: 180px;
    overflow-y: auto;
}

.history-panel.show {
    display: block;
}

.history-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.history-item {
    padding: 7px;
    border-bottom: 1px solid #ccc;
    font-size: 14px;
    cursor: pointer;
}

.history-item:hover {
    background: #e1e6ed;
}

/* Dark mode */
body.dark {
    background: #15171b;
}

body.dark .calculator {
    background: #24272d;
    color: white;
}

body.dark .title {
    color: white;
}

body.dark .display-box,
body.dark .history-panel {
    background: #191b20;
}

body.dark .expression {
    color: #aaa;
}

body.dark .display {
    color: white;
}

body.dark .utility,
body.dark .number,
body.dark .extra,
body.dark .bottom-button {
    background: #353941;
    color: white;
}

body.dark .scientific {
    background: #403866;
    color: white;
}

body.dark .operator {
    background: #35465e;
    color: white;
}

body.dark .equals {
    background: #4d78b8;
    color: white;
}

body.dark .history-item {
    border-color: #444;
}

.mode-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.mode-button {
    min-height: 42px;
    background: #dfe5ec;
    font-size: 14px;
}

body.dark .mode-button {
    background: #353941;
    color: white;
}

/* Small screens */
@media (max-width: 430px) {
    .calculator {
        padding: 12px;
    }

    button {
        min-height: 48px;
    }

    .display {
        font-size: 29px;
    }

    .scientific {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <div class="title">CALCULATOR</div>

    <!-- DISPLAY -->
    <div class="display-box">
        <div class="expression" id="expression"></div>
        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >
    </div>

    <!-- TOP CONTROLS -->
    <div class="top-controls">
        <button class="utility" onclick="clearAll()">C</button>
        <button class="utility" onclick="clearEntry()">CE</button>
        <button class="utility" onclick="deleteLast()">DEL</button>
        <button class="utility" onclick="press('%')">%</button>
        <button class="utility" onclick="press('/')">÷</button>
    </div>

    <!-- SCIENTIFIC BUTTONS -->
    <div class="scientific-row" id="scientificRow">
        <button class="scientific" onclick="scientific('sin')">sin</button>
        <button class="scientific" onclick="scientific('cos')">cos</button>
        <button class="scientific" onclick="scientific('tan')">tan</button>
        <button class="scientific" onclick="scientific('sqrt')">√</button>
        <button class="scientific" onclick="scientific('square')">x²</button>
        <button class="scientific" onclick="scientific('log')">log</button>
    </div>

    <!-- MAIN KEYPAD -->
    <div class="main-keypad">

        <!-- NUMBER SIDE -->
        <div class="number-grid">

            <button class="number" onclick="press('7')">7</button>
            <button class="number" onclick="press('8')">8</button>
            <button class="number" onclick="press('9')">9</button>

            <button class="number" onclick="press('4')">4</button>
            <button class="number" onclick="press('5')">5</button>
            <button class="number" onclick="press('6')">6</button>

            <button class="number" onclick="press('1')">1</button>
            <button class="number" onclick="press('2')">2</button>
            <button class="number" onclick="press('3')">3</button>

            <button class="number" onclick="press('0')">0</button>
            <button class="number" onclick="press('00')">00</button>
            <button class="number" onclick="press('.')">.</button>

            <button class="extra" onclick="plusMinus()">+/−</button>
            <button class="extra" onclick="copyDisplay()">COPY</button>
            <button class="extra" onclick="pasteDisplay()">PASTE</button>

        </div>

        <!-- OPERATOR SIDE -->
        <div class="operator-grid">

            <button class="operator" onclick="press('*')">×</button>
            <button class="operator" onclick="press('-')">−</button>
            <button class="operator" onclick="press('+')">+</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>

    <!-- BOTTOM CONTROLS -->
    <div class="bottom-controls">
        <button class="bottom-button" onclick="toggleScientific()">
            SCI
        </button>

        <button class="bottom-button" onclick="toggleHistory()">
            HISTORY
        </button>

        <button class="bottom-button" onclick="clearHistory()">
            CLEAR HISTORY
        </button>

        <button class="bottom-button" onclick="saveHistory()">
            SAVE HISTORY
        </button>
    </div>

    <!-- DARK / LIGHT -->
    <div class="mode-row">

        <button class="mode-button" onclick="toggleDarkMode()">
            ☀ Light / 🌙 Dark
        </button>

        <button class="mode-button" onclick="clearAll()">
            RESET
        </button>

    </div>

    <!-- HISTORY -->
    <div class="history-panel" id="historyPanel">

        <div class="history-title">
            Calculation History
        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

let current = "0";
let previous = "";
let operator = "";
let waitingForOperand = false;
let history = JSON.parse(localStorage.getItem("ebadCalculatorHistory")) || [];

const display = document.getElementById("display");
const expression = document.getElementById("expression");


/* --------------------------------
   DISPLAY
-------------------------------- */

function updateDisplay() {

    display.value = formatNumber(current);

}


/* --------------------------------
   NUMBER FORMAT
-------------------------------- */

function formatNumber(value) {

    if (value === "Error") {
        return value;
    }

    if (value === "") {
        return "0";
    }

    if (value.includes("e")) {
        return value;
    }

    let negative = value.startsWith("-");

    if (negative) {
        value = value.substring(1);
    }

    let parts = value.split(".");
    let integerPart = parts[0];

    integerPart = integerPart.replace(
        /\B(?=(\d{3})+(?!\d))/g,
        ","
    );

    let result = integerPart;

    if (parts.length > 1) {
        result += "." + parts[1];
    }

    return negative ? "-" + result : result;
}


/* --------------------------------
   REMOVE COMMAS
-------------------------------- */

function cleanNumber(value) {

    return value.replace(/,/g, "");

}


/* --------------------------------
   PRESS
-------------------------------- */

function press(value) {

    if (value >= "0" && value <= "9") {

        if (waitingForOperand) {

            current = value;
            waitingForOperand = false;

        } else {

            if (current === "0") {
                current = value;
            } else {
                current += value;
            }

        }

        updateDisplay();
        return;
    }


    if (value === "00") {

        if (waitingForOperand) {

            current = "0";
            waitingForOperand = false;

        } else if (current !== "0") {

            current += "00";

        }

        updateDisplay();
        return;
    }


    if (value === ".") {

        if (waitingForOperand) {

            current = "0.";
            waitingForOperand = false;

        } else if (!current.includes(".")) {

            current += ".";

        }

        updateDisplay();
        return;
    }


    if (value === "%") {

        current = String(parseFloat(cleanNumber(current)) / 100);

        updateDisplay();
        return;
    }


    if (["+", "-", "*", "/"].includes(value)) {

        if (operator && !waitingForOperand) {
            calculate();
        }

        previous = cleanNumber(current);
        operator = value;
        waitingForOperand = true;

        expression.textContent =
            formatNumber(previous) + " " + operatorSymbol(value);

    }

}


/* --------------------------------
   OPERATOR SYMBOL
-------------------------------- */

function operatorSymbol(op) {

    if (op === "*") return "×";
    if (op === "/") return "÷";
    if (op === "-") return "−";
    return "+";

}


/* --------------------------------
   CALCULATE
-------------------------------- */

function calculate() {

    if (!operator || previous === "") {
        return;
    }

    let a = parseFloat(previous);
    let b = parseFloat(cleanNumber(current));
    let result;

    if (operator === "+") {
        result = a + b;
    }

    if (operator === "-") {
        result = a - b;
    }

    if (operator === "*") {
        result = a * b;
    }

    if (operator === "/") {

        if (b === 0) {

            current = "Error";
            previous = "";
            operator = "";
            expression.textContent = "Cannot divide by zero";
            updateDisplay();
            return;

        }

        result = a / b;

    }

    result = Number(result.toPrecision(12));

    let calculation =
        formatNumber(String(a)) +
        " " +
        operatorSymbol(operator) +
        " " +
        formatNumber(String(b)) +
        " = " +
        formatNumber(String(result));

    addHistory(calculation);

    expression.textContent = calculation;

    current = String(result);
    previous = "";
    operator = "";
    waitingForOperand = true;

    updateDisplay();

}


/* --------------------------------
   CLEAR
-------------------------------- */

function clearAll() {

    current = "0";
    previous = "";
    operator = "";
    waitingForOperand = false;

    expression.textContent = "";

    updateDisplay();

}


function clearEntry() {

    current = "0";
    updateDisplay();

}


function deleteLast() {

    if (current.length <= 1) {

        current = "0";

    } else {

        current = current.slice(0, -1);

    }

    updateDisplay();

}


/* --------------------------------
   PLUS / MINUS
-------------------------------- */

function plusMinus() {

    if (current === "0") {
        return;
    }

    if (current.startsWith("-")) {

        current = current.substring(1);

    } else {

        current = "-" + current;

    }

    updateDisplay();

}


/* --------------------------------
   SCIENTIFIC
-------------------------------- */

function scientific(type) {

    let number = parseFloat(cleanNumber(current));

    if (isNaN(number)) {
        return;
    }

    let result;

    if (type === "sin") {

        result = Math.sin(number * Math.PI / 180);

    }

    if (type === "cos") {

        result = Math.cos(number * Math.PI / 180);

    }

    if (type === "tan") {

        result = Math.tan(number * Math.PI / 180);

    }

    if (type === "sqrt") {

        if (number < 0) {
            current = "Error";
            updateDisplay();
            return;
        }

        result = Math.sqrt(number);

    }

    if (type === "square") {

        result = number * number;

    }

    if (type === "log") {

        if (number <= 0) {
            current = "Error";
            updateDisplay();
            return;
        }

        result = Math.log10(number);

    }

    result = Number(result.toPrecision(12));

    let text = "";

    if (type === "sin") text = "sin(" + number + ")";
    if (type === "cos") text = "cos(" + number + ")";
    if (type === "tan") text = "tan(" + number + ")";
    if (type === "sqrt") text = "√(" + number + ")";
    if (type === "square") text = number + "²";
    if (type === "log") text = "log(" + number + ")";

    let calculation =
        text + " = " + formatNumber(String(result));

    addHistory(calculation);

    expression.textContent = calculation;

    current = String(result);
    waitingForOperand = true;

    updateDisplay();

}


/* --------------------------------
   SCIENTIFIC TOGGLE
-------------------------------- */

function toggleScientific() {

    const row = document.getElementById("scientificRow");

    row.classList.toggle("show");

}


/* --------------------------------
   HISTORY
-------------------------------- */

function addHistory(item) {

    history.unshift(item);

    if (history.length > 50) {
        history.pop();
    }

    localStorage.setItem(
        "ebadCalculatorHistory",
        JSON.stringify(history)
    );

    renderHistory();

}


function renderHistory() {

    const list = document.getElementById("historyList");

    list.innerHTML = "";

    history.forEach(function(item) {

        const div = document.createElement("div");

        div.className = "history-item";

        div.textContent = item;

        div.onclick = function() {

            const parts = item.split("=");

            if (parts.length > 1) {

                current = cleanNumber(
                    parts[parts.length - 1].trim()
                );

                updateDisplay();

            }

        };

        list.appendChild(div);

    });

}


function toggleHistory() {

    document
        .getElementById("historyPanel")
        .classList.toggle("show");

    renderHistory();

}


function clearHistory() {

    history = [];

    localStorage.removeItem(
        "ebadCalculatorHistory"
    );

    renderHistory();

}


function saveHistory() {

    if (history.length === 0) {

        alert("No calculation history to save.");

        return;

    }

    const text = history.join("\n");

    const blob = new Blob(
        [text],
        { type: "text/plain" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "Ebad_Calculator_History.txt";

    a.click();

    URL.revokeObjectURL(url);

}


/* --------------------------------
   COPY
-------------------------------- */

async function copyDisplay() {

    try {

        await navigator.clipboard.writeText(
            cleanNumber(current)
        );

    } catch {

        alert("Copy is not available in this browser.");

    }

}


/* --------------------------------
   PASTE
-------------------------------- */

async function pasteDisplay() {

    try {

        let text =
            await navigator.clipboard.readText();

        text = text.replace(/,/g, "").trim();

        if (!isNaN(text)) {

            current = text;

            updateDisplay();

        }

    } catch {

        alert("Paste permission was blocked by the browser.");

    }

}


/* --------------------------------
   DARK MODE
-------------------------------- */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "ebadDarkMode",
        document.body.classList.contains("dark")
    );

}


/* --------------------------------
   KEYBOARD
-------------------------------- */

document.addEventListener("keydown", function(event) {

    const key = event.key;


    if (
        (key >= "0" && key <= "9") ||
        key === "."
    ) {

        press(key);

        event.preventDefault();

        return;

    }


    if (
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "%"
    ) {

        press(key);

        event.preventDefault();

        return;

    }


    if (key === "Enter" || key === "=") {

        calculate();

        event.preventDefault();

        return;

    }


    if (key === "Backspace") {

        deleteLast();

        event.preventDefault();

        return;

    }


    if (key === "Escape") {

        clearAll();

        event.preventDefault();

        return;

    }

});


/* --------------------------------
   LOAD SETTINGS
-------------------------------- */

if (
    localStorage.getItem("ebadDarkMode") === "true"
) {

    document.body.classList.add("dark");

}


renderHistory();
updateDisplay();

</script>

</body>
</html>
